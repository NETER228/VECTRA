<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#07070d">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vectra — проверка</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<script src="js/core.js"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/boot.js"></script>
</head>
<body class="cap">
<canvas id="c" aria-hidden="true"></canvas>

<main class="win" id="win" aria-labelledby="t">
  <div class="brand">
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M4 4.5l8 15.5 8-15.5M8.3 4.5L12 11.8l3.7-7.3"/></svg></div>
    <b>VECTRA</b>
  </div>
  <div class="row">
    <button class="box" id="box" aria-label="Начать задачу с линией"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <span id="t">Задача с линией</span>
  </div>
  <p class="dq-note">Это демонстрация механики, а не проверка человека.</p>
  <p id="msg" role="status" aria-live="polite">Поставь галочку в квадрате, затем проведи мышью по подсвеченной линии.</p>
</main>

<section class="win okc off" id="ok" aria-live="polite">
  <div class="big"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#06140d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h2>Задача выполнена</h2>
  <p id="okTxt"></p>
</section>

<div class="hint off" id="hint"><span id="hintTxt"></span><div class="bar"><i id="bar"></i></div></div>

<script>Vectra.run(['js/i18n.js', 'js/sfx.js', 'js/terms.js', 'js/nick.js', 'js/captcha.js'], { gate: false })</script>
</body>
</html>
