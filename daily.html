<body class="gm">
<div class="g-wrap">
  <header class="g-top">
    <a class="brand" href="index.html" aria-label="Vectra — home"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M4 4.5l8 15.5 8-15.5M8.3 4.5L12 11.8l3.7-7.3"/></svg></div><b>VECTRA</b></a>

      <div id="numin"></div>
      <p class="dq-note" id="dqTip"></p>
      <p class="dq-hint" id="hint" aria-live="polite"></p>
      <button class="go" id="chk"></button>
    </div>
    <div class="dq-res off" id="res"></div>
  </section>
  <p class="fairnote" data-i18n="fair.short"></p>
</div>
